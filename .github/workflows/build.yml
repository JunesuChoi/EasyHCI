name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild EasyHCI.sln /t:Rebuild /p:Configuration=Release /v:minimal /nologo

      - name: Stage the release payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path stage -Force | Out-Null
          Copy-Item bin\Release\EasyHCI.exe, bin\Release\EasyHCI.exe.config, bin\Release\MaterialSkin.dll stage
          Get-ChildItem stage | ForEach-Object { '{0,10}  {1}' -f $_.Length, $_.Name }

      - name: Confirm memtest.exe is not part of the payload
        shell: pwsh
        run: |
          # HCI MemTest is proprietary freeware and must never be redistributed here.
          $leak = Get-ChildItem stage -Recurse -Filter 'memtest.exe'
          if ($leak) { throw "memtest.exe leaked into the payload: $($leak.FullName -join ', ')" }
          Write-Host 'payload carries no HCI MemTest binary'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyHCI
          path: stage/*

      - name: Package release zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path stage\* -DestinationPath EasyHCI.zip -Force

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: EasyHCI.zip
          generate_release_notes: true

